<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Use AI, Don't Let AI Use You — under the tree</title>
<meta name="description" content="Read under a living tree. A library in a simulated world." />
<meta name="theme-color" content="#03050a" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03050a;color:#e8eef5;font-family:Inter,system-ui,-apple-system,sans-serif}
#treeFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#03050a}
#topBar{
  position:fixed;z-index:20;left:0;right:0;top:0;
  padding:.75rem 1rem;padding-top:max(.75rem,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  background:linear-gradient(to bottom,rgba(3,5,10,.75),transparent);
  pointer-events:none;
}
#topBar .brand{font-family:Georgia,serif;font-style:italic;font-size:.95rem;color:#e2e8f0;pointer-events:none}
#topBar .brand small{display:block;font-family:Inter,sans-serif;font-style:normal;font-size:.5rem;letter-spacing:.28em;text-transform:uppercase;color:#94a3b8;margin-top:2px}
.glassBtn{
  pointer-events:auto;cursor:pointer;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:#f1f5f9;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
  padding:.65rem 1.1rem;border-radius:999px;
  box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
}
.glassBtn:hover{background:rgba(255,255,255,.14);border-color:rgba(56,189,248,.45)}

/* Library panel — liquid glass */
#library{
  position:fixed;z-index:30;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(3,5,10,.25);
  opacity:0;pointer-events:none;transition:opacity .45s ease;
  padding:1rem;
}
#library.open{opacity:1;pointer-events:auto}
#libCard{
  width:min(420px,94vw);
  background:rgba(20,28,40,.45);
  border:1px solid rgba(255,255,255,.16);
  border-radius:20px;
  backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);
  box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
  padding:1.35rem 1.25rem 1.25rem;
  transform:translateY(12px) scale(.98);transition:transform .45s ease;
}
#library.open #libCard{transform:translateY(0) scale(1)}
#libCard h1{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;font-weight:500;margin-bottom:.25rem}
#libCard .sub{font-size:.55rem;letter-spacing:.28em;text-transform:uppercase;color:#94a3b8;margin-bottom:1.1rem}
.bookRow{
  display:flex;gap:.85rem;align-items:stretch;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:.85rem;margin-bottom:.85rem;
}
.bookCover{
  width:64px;min-width:64px;height:88px;border-radius:6px;
  background:linear-gradient(150deg,#0d1f33,#1a4060 50%,#0b1c2e);
  border:1px solid rgba(56,189,248,.4);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.bookCover span{font-family:Georgia,serif;font-style:italic;font-size:.55rem;color:#7dd3fc;text-align:center;line-height:1.25;padding:4px}
.bookMeta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.25rem}
.bookMeta .t{font-family:Georgia,serif;font-size:.95rem;line-height:1.3}
.bookMeta .a{font-size:.7rem;color:#94a3b8}
.bookMeta .tag{font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:#38bdf8;margin-top:.2rem}
.primary{
  width:100%;margin-top:.35rem;cursor:pointer;
  background:linear-gradient(135deg,rgba(56,189,248,.35),rgba(14,165,233,.25));
  border:1px solid rgba(56,189,248,.5);
  color:#e0f2fe;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
  padding:.8rem;border-radius:12px;
  backdrop-filter:blur(8px);
}
.primary:hover{background:linear-gradient(135deg,rgba(56,189,248,.5),rgba(14,165,233,.35))}
.ghost{
  width:100%;margin-top:.5rem;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.12);
  color:#94a3b8;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.65rem;border-radius:12px;
}

/* Environment presets */
#presets{margin-top:1rem}
#presets .label{font-size:.5rem;letter-spacing:.28em;text-transform:uppercase;color:#64748b;margin-bottom:.45rem}
.presetGrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.preset{
  cursor:pointer;text-align:left;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:.55rem .6rem;
  color:#cbd5e1;font-size:.62rem;line-height:1.35;
}
.preset strong{display:block;font-size:.58rem;letter-spacing:.06em;color:#e2e8f0;margin-bottom:2px}
.preset.on{border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.12)}

/* Reader */
#reader{
  position:fixed;z-index:40;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,10,18,.38);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .5s ease;padding:1rem;
}
#reader.open{opacity:1;pointer-events:auto}
#reader.full{background:rgba(8,12,20,.96)}
#readerChrome{width:min(640px,94vw);display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.55rem}
#readerChrome .title{font-family:Georgia,serif;font-style:italic;font-size:.9rem}
#readerChrome .sub{font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8}
.rbtn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#e2e8f0;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.42rem .65rem;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(12px);
}
#bookStage{width:min(640px,94vw);height:min(68vh,500px);position:relative;transform-style:preserve-3d;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
#bookStage.full{height:min(80vh,620px)}
.pageFace{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#f9f7f1;color:#2c3036;
  border:1px solid #e5e1d4;display:flex;flex-direction:column;padding:1.2rem 1.25rem 1rem}
.pageFace .label{font-size:.54rem;letter-spacing:.3em;text-transform:uppercase;color:#8b929a}
.pageFace h2{font-family:Georgia,serif;font-weight:600;font-size:clamp(1.02rem,3vw,1.22rem);margin:.35rem 0 .85rem;line-height:1.3}
.pageFace .body{font-family:Georgia,serif;font-size:clamp(.94rem,2.5vw,1.04rem);line-height:1.75;flex:1;overflow:auto}
.pageFace .body p+p{margin-top:.8em}
.pageFace .principles{margin-top:.65em;padding-left:.3em}
.pageFace .principles p+p{margin-top:.35em}
.pageFace .folio{margin-top:auto;padding-top:.5rem;font-family:Georgia,serif;font-size:.68rem;color:#a8a394;letter-spacing:.12em}
#leafTurn{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:5;pointer-events:none}
#leafTurn .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;background:#f9f7f1;border:1px solid #e5e1d4;padding:1.2rem 1.25rem}
#leafTurn .face-back{transform:rotateY(180deg);background:#f3f0e8}
#leafTurn.turning{animation:leafTurn 1.1s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes leafTurn{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
#readerNav{width:min(640px,94vw);display:flex;gap:.4rem;justify-content:center;margin-top:.65rem;flex-wrap:wrap}
</style>
</head>
<body>
<iframe id="treeFrame" src="tree/index.html" title="Tree world" allow="autoplay"></iframe>

<div id="topBar">
  <div class="brand">Under the tree<small>A living library</small></div>
  <button type="button" class="glassBtn" id="libBtn">View Library</button>
</div>

<div id="library" aria-hidden="true">
  <div id="libCard">
    <h1>Library</h1>
    <p class="sub">Books in this world</p>
    <div class="bookRow">
      <div class="bookCover"><span>Use AI,<br>Don't Let<br>AI Use You</span></div>
      <div class="bookMeta">
        <div class="t">Use AI, Don't Let AI Use You</div>
        <div class="a">Shane Kittelson-Burke</div>
        <div class="tag">Available · 6 chapters</div>
      </div>
    </div>
    <div id="presets">
      <div class="label">Reading place</div>
      <div class="presetGrid">
        <button type="button" class="preset on" data-preset="maple-night"><strong>Maple · night</strong>Deep clear sky</button>
        <button type="button" class="preset" data-preset="maple-blizzard"><strong>Maple · blizzard</strong>Winter storm</button>
        <button type="button" class="preset" data-preset="maple-dawn"><strong>Maple · dawn</strong>Morning light</button>
        <button type="button" class="preset" data-preset="cherry-dusk"><strong>Cherry · dusk</strong>Warm evening</button>
      </div>
    </div>
    <button type="button" class="primary" id="startRead">Start reading</button>
    <button type="button" class="ghost" id="closeLib">Back to tree</button>
  </div>
</div>

<div id="reader">
  <div id="readerChrome">
    <div>
      <div class="title">Use AI, Don't Let AI Use You</div>
      <div class="sub">Under the tree · Shane Kittelson-Burke</div>
    </div>
    <div style="display:flex;gap:.35rem;flex-wrap:wrap">
      <button type="button" class="rbtn" id="expandBtn">Larger view</button>
      <button type="button" class="rbtn" id="pauseRead">Tree break</button>
      <button type="button" class="rbtn" id="closeReader">Library</button>
    </div>
  </div>
  <div id="bookStage">
    <div class="pageFace" id="pageUnder"></div>
    <div id="leafTurn">
      <div class="face face-front" id="pageFront"></div>
      <div class="face face-back" id="pageBack"></div>
    </div>
  </div>
  <div id="readerNav">
    <button type="button" class="rbtn" id="prevCh">Previous</button>
    <button type="button" class="rbtn" id="tocBtn">Contents</button>
    <button type="button" class="rbtn" id="nextCh">Next page</button>
  </div>
</div>

<script>
const chapters=[
{num:1,roman:'I',title:'Introduction - Defining Good and Evil',body:'<p>Good and evil are the two edges of every tool, and AI is no exception. AI\'s potential depends not on the tool itself but on who controls it and how it is used.</p><p>Good reflects empathy, justice, and responsibility, actions meant to uplift humanity. Evil, on the other hand, emerges through selfishness, indifference, and misuse, often disguised in convenience. AI can either enhance humanity\'s lives or amplify our worst impulses, depending on how it is wielded.</p><p>This book explores how we can use AI for good, avoid its dangers, and ultimately shape a future worth fighting for.</p>'},
{num:2,roman:'II',title:'What AI Can Do for Good',body:'<p>AI has the potential to solve complex problems, automate mundane tasks, and unlock new levels of creativity. It is already improving healthcare, addressing climate challenges, and bridging gaps across industries.</p><p>But the same technology that saves lives can also disrupt them if not guided by the right intent.</p>'},
{num:3,roman:'III',title:'How AI Could Go Wrong',body:'<p>Unchecked AI can easily become a tool of manipulation, surveillance, or bias. Algorithms can spread misinformation, invade privacy, and consolidate power in dangerous ways.</p><p>Once released, the consequences are often irreversible, turning tools of progress into instruments of control.</p>'},
{num:4,roman:'IV',title:'Key Morals for Responsible AI Use',body:'<p>We must instill core principles in AI development:</p><div class="principles"><p>- Transparency: AI systems must be understandable.</p><p>- Accountability: Developers and users must own outcomes.</p><p>- Empathy: AI should always serve humanity\'s well-being.</p><p>- Equity: The benefits of AI must be shared fairly.</p></div>'},
{num:5,roman:'V',title:'Navigating the Unknown Future with AI',body:'<p>The future of AI is uncertain, evolving faster than regulations can keep up. We must stay vigilant and make wise decisions today to ensure AI works for us tomorrow.</p><p>In this unpredictable landscape, AI can either become our greatest ally or a threat we cannot control.</p>'},
{num:6,roman:'VI',title:'The Call to Action',body:'<p>Every individual has a role in shaping AI\'s future. Push for accountability, demand transparency, and stay informed.</p><p>The window to act is closing. We must decide: Will AI be our tool for good, or will it control us for evil?</p>'}
];

const PRESETS={
  'maple-night':{species:'maple',day:120,time:22.2,weather:'clear',intensity:'super',cam:{x:9.5,y:5,z:12},target:{x:0,y:2.4,z:0}},
  'maple-blizzard':{species:'maple',day:350,time:21,weather:'snow',intensity:'super',cam:{x:10,y:5.5,z:13},target:{x:0,y:2.2,z:0}},
  'maple-dawn':{species:'maple',day:80,time:5.8,weather:'clear',intensity:'normal',cam:{x:9,y:4.5,z:11},target:{x:0,y:2,z:0}},
  'cherry-dusk':{species:'cherry',day:100,time:18.8,weather:'clear',intensity:'normal',cam:{x:8.5,y:4.2,z:10.5},target:{x:0,y:2.1,z:0}}
};

const tree=document.getElementById('treeFrame');
function cmd(p){try{tree.contentWindow&&tree.contentWindow.postMessage({type:'tree-cmd',...p},'*');}catch(e){}}
let chapterIndex=0,busy=false,readerFull=false,activePreset='maple-night';
let actx;
function flipSound(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,b=actx.createBuffer(1,actx.sampleRate*0.12,actx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*8)*0.4;
    const s=actx.createBufferSource();s.buffer=b;
    const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;
    const g=actx.createGain();g.gain.setValueAtTime(0.14,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);
  }catch(e){}
}
function pageHTML(ch){
  return '<p class="label">Chapter '+ch.num+' · '+ch.roman+'</p><h2>'+ch.title+'</h2><div class="body">'+ch.body+'</div><div class="folio">'+ch.roman+'</div>';
}
function paintPages(){
  const cur=chapters[chapterIndex],next=chapters[(chapterIndex+1)%6];
  document.getElementById('pageFront').innerHTML=pageHTML(cur);
  document.getElementById('pageUnder').innerHTML=pageHTML(next);
  document.getElementById('pageBack').innerHTML='<p class="label">Chapter</p><h2 style="font-family:Georgia;font-style:italic;color:#a8a394;margin-top:2rem;text-align:center">'+next.roman+'</h2>';
}
function applyPreset(key){
  activePreset=key;
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',b.dataset.preset===key));
  const P=PRESETS[key];
  if(P) cmd({cmd:'preset',preset:P});
}
function openLibrary(){
  document.getElementById('library').classList.add('open');
  document.getElementById('library').setAttribute('aria-hidden','false');
  cmd({cmd:'hideUI'});
}
function closeLibrary(){
  document.getElementById('library').classList.remove('open');
  document.getElementById('library').setAttribute('aria-hidden','true');
  cmd({cmd:'showUI'});
}
function startReading(){
  document.getElementById('library').classList.remove('open');
  applyPreset(activePreset);
  cmd({cmd:'hideUI'});
  document.getElementById('reader').classList.add('open');
  paintPages();
}
function treeBreak(){
  document.getElementById('reader').classList.remove('open','full');
  document.getElementById('bookStage').classList.remove('full');
  readerFull=false;
  cmd({cmd:'showUI'});
}
function backLibrary(){
  document.getElementById('reader').classList.remove('open','full');
  openLibrary();
}

document.getElementById('libBtn').onclick=openLibrary;
document.getElementById('closeLib').onclick=closeLibrary;
document.getElementById('startRead').onclick=startReading;
document.getElementById('pauseRead').onclick=treeBreak;
document.getElementById('closeReader').onclick=backLibrary;
document.getElementById('expandBtn').onclick=()=>{
  readerFull=!readerFull;
  document.getElementById('reader').classList.toggle('full',readerFull);
  document.getElementById('bookStage').classList.toggle('full',readerFull);
  document.getElementById('expandBtn').textContent=readerFull?'Show world':'Larger view';
};
document.querySelectorAll('.preset').forEach(b=>{
  b.onclick=()=>applyPreset(b.dataset.preset);
});
document.getElementById('nextCh').onclick=()=>{
  if(busy)return;busy=true;flipSound();
  const leaf=document.getElementById('leafTurn');
  leaf.classList.add('turning');
  setTimeout(()=>{chapterIndex=(chapterIndex+1)%6;leaf.classList.remove('turning');paintPages();busy=false;},1100);
};
document.getElementById('prevCh').onclick=()=>{
  if(busy)return;busy=true;flipSound();
  chapterIndex=(chapterIndex-1+6)%6;paintPages();setTimeout(()=>busy=false,200);
};
document.getElementById('tocBtn').onclick=()=>{
  const n=parseInt(prompt('Chapter 1–6'),10);
  if(n>=1&&n<=6){chapterIndex=n-1;paintPages();}
};

tree.addEventListener('load',()=>{
  setTimeout(()=>{
    applyPreset('maple-night');
    cmd({cmd:'showUI'});
  },800);
});
</script>
</body>
</html>
