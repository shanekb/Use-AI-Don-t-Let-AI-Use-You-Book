function loadTex(path, srgb=true, repeat=true) {
  const t = texLoader.load(path);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}

  birch:{name:"Birch",growthRate:1.28,maxHeight:8.0,trunkColor:0x5c5346,branchSpread:0.72,branchUpward:0.5,leafSize:0.72,leafDensity:1.2,blossom:false,barkRoughness:0.68},

let treeGroup, branchMeshes=[], leafMeshes=[], fallingLeaves=[], groundLeafMeshes=[], branchTips=[];

// ========== AUDIO (quieter, more silence) ==========
let audioCtx, masterGain, windGain, rainGain, snowGain, thunderGain;
let windFilter, rainFilter;

function createNoiseBuffer(ctx, sec) {
  // Soft brown noise — low hiss, more "air" than static
  const rate=ctx.sampleRate, len=rate*sec, buf=ctx.createBuffer(1,len,rate), d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    last = (last + 0.02*w) / 1.02;
    d[i] = last * 1.1; // much quieter raw noise
  }
  return buf;
}

function initAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.28; masterGain.connect(audioCtx.destination);

  windGain=audioCtx.createGain(); windGain.gain.value=0.00001;
  windFilter=audioCtx.createBiquadFilter(); windFilter.type='lowpass'; windFilter.frequency.value=220; windFilter.Q.value=0.7;
  windGain.connect(windFilter); windFilter.connect(masterGain);
  const ws=audioCtx.createBufferSource(); ws.buffer=createNoiseBuffer(audioCtx,7); ws.loop=true; ws.connect(windGain); ws.start();

  rainGain=audioCtx.createGain(); rainGain.gain.value=0.0001;
  rainFilter=audioCtx.createBiquadFilter(); rainFilter.type='bandpass'; rainFilter.frequency.value=1300; rainFilter.Q.value=0.55;
  rainGain.connect(rainFilter); rainFilter.connect(masterGain);
  const rs=audioCtx.createBufferSource(); rs.buffer=createNoiseBuffer(audioCtx,5); rs.loop=true; rs.connect(rainGain); rs.start();

  snowGain=audioCtx.createGain(); snowGain.gain.value=0.0001;
  const sf=audioCtx.createBiquadFilter(); sf.type='highpass'; sf.frequency.value=2600;
  snowGain.connect(sf); sf.connect(masterGain);
  const ss=audioCtx.createBufferSource(); ss.buffer=createNoiseBuffer(audioCtx,6); ss.loop=true; ss.connect(snowGain); ss.start();

  thunderGain=audioCtx.createGain(); thunderGain.gain.value=0.85; thunderGain.connect(masterGain);
  audioReady=true;
  document.getElementById('status').textContent='Audio ON';
}

function playThunder(){
  if(!audioReady||muted||!audioCtx)return;
  const now=audioCtx.currentTime, osc=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=150; osc.type='sawtooth';
  osc.frequency.setValueAtTime(65,now); osc.frequency.exponentialRampToValueAtTime(25,now+1.9);
  g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.4,now+0.06); g.gain.exponentialRampToValueAtTime(0.0001,now+2.7);
  osc.connect(f); f.connect(g); g.connect(thunderGain); osc.start(now); osc.stop(now+3);
}

function updateAudio(){
  if(!audioReady||muted||!audioCtx)return;
  const im = intensityMultiplier();
  const now = audioCtx.currentTime;

  // --- WIND: MW-style — mostly quiet, then a real whoosh, then silence ---
  // Almost no constant bed (kills white-noise feel)
  let windVol = 0.0008;
  // Sparse gusts: rare on clear, more in storm/blizzard
  let gustChance = 0.0015;
  if (currentWeather === 'snow') gustChance = intensityLevel === 'super' ? 0.012 : intensityLevel === 'intense' ? 0.007 : 0.003;
  else if (currentWeather === 'storm') gustChance = 0.01;
  else if (currentWeather === 'rain') gustChance = 0.004;
  else if (currentWeather === 'clear') gustChance = 0.0008;

  if (Math.random() < gustChance) {
    // Schedule a short gust envelope (whoosh in, die out)
    const peak = 0.04 + windStrength * 0.06 + (currentWeather === 'storm' || intensityLevel === 'super' ? 0.05 : 0);
    windGain.gain.cancelScheduledValues(now);
    windGain.gain.setValueAtTime(Math.max(0.0008, windGain.gain.value), now);
    windGain.gain.linearRampToValueAtTime(peak, now + 0.35 + Math.random()*0.4);
    windGain.gain.linearRampToValueAtTime(0.0008, now + 1.8 + Math.random()*1.5);
    windFilter.frequency.cancelScheduledValues(now);
    windFilter.frequency.linearRampToValueAtTime(140 + Math.random()*120, now + 0.3);
    windFilter.frequency.linearRampToValueAtTime(90 + windStrength * 40, now + 2.0);
  } else {
    // Decay toward near-silence if no gust
    const target = (currentWeather === 'snow' && intensityLevel === 'super') ? 0.006 : 0.0008;
    windGain.gain.linearRampToValueAtTime(target, now + 2.5);
    windFilter.frequency.linearRampToValueAtTime(100 + windStrength * 50, now + 2.0);
  }

  // --- RAIN: only when actually raining, much less static ---
  if ((currentWeather === 'rain' || currentWeather === 'storm') && weatherIntensity > 0.12) {
    // Soft rain bed — filtered, not harsh static
    const rainVol = 0.018 + weatherIntensity * 0.06 * im;
    rainGain.gain.linearRampToValueAtTime(rainVol, now + 1.2);
    rainFilter.frequency.linearRampToValueAtTime(700 + im * 250, now + 1.0);
  } else {
    rainGain.gain.linearRampToValueAtTime(0.0001, now + 2.5);
  }

  // --- SNOW: almost silent bed; storm feel comes from wind gusts ---
  if (currentWeather === 'snow' && weatherIntensity > 0.12) {
    const snowVol = 0.004 + weatherIntensity * 0.012 * im;
    snowGain.gain.linearRampToValueAtTime(snowVol, now + 1.5);
  } else {
    snowGain.gain.linearRampToValueAtTime(0.0001, now + 2.5);
  }

  // Thunder only on real storms, less frequent
  if (currentWeather === 'storm' && Math.random() < 0.0018 * im) playThunder();
}

function tryEnableAudio(){initAudio(); if(audioCtx?.state==='suspended') audioCtx.resume();}

const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,250);
camera.position.set(9.5, 5.2, 12.5);

// Keep the orbit target locked on the vertical center of the tree
function lockCameraToTree() {
  const sp = SPECIES[currentSpecies];
  const age = day / 365;
  const h = 0.35 + (sp.maxHeight - 0.8) * (1 - Math.exp(-age / (7.0 / sp.growthRate))) * sp.growthRate;
  const dist = camera.position.length();
  const camY = camera.position.y;
  let aimY;
  if (camY > h * 0.9) {
    // Above the tree (close or far) – aim at crown so sky opens up above
    aimY = h * 1.15;
  } else if (dist < 8) {
    aimY = Math.max(2.2, h * 0.75);
  } else {
    aimY = Math.max(1.8, h * 0.55);
  }
  controls.target.set(0, aimY, 0);
}

// Smooth visual growth – tiny scale changes, no topology jumps
function updateTreeScale() {
  if (!treeGroup) return;
  const sp = SPECIES[currentSpecies];
  const age = day / 365;
  // Maps age to a gentle scale so the tree grows a little every day
  const targetScale = 0.55 + Math.min(age * 0.42 * sp.growthRate, 2.8);
  const current = treeGroup.scale.x;
  // Move only a tiny step toward target (no doubling)
  const next = current + (targetScale - current) * 0.08;
  treeGroup.scale.setScalar(next);
}

// ===== 360° HILLS =====
function createRingHills(){
  const group=new THREE.Group();
  for(let i=0;i<12;i++){
    const angle=i/12*Math.PI*2;
    const dist=90+Math.random()*50;
    const shape=new THREE.Shape();
    const w=7+Math.random()*5;
    shape.moveTo(-w,0);
    shape.quadraticCurveTo(-w*0.4, 3+Math.random()*3.5, 0, 2+Math.random()*2.5);
    shape.quadraticCurveTo(w*0.4, 3.5+Math.random()*3, w, 0);
    shape.lineTo(w,-1); shape.lineTo(-w,-1);
    const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({color:i%2?0x1e3a2f:0x166534,transparent:true,opacity:0.6}));
    mesh.position.set(Math.cos(angle)*dist, 0.05, Math.sin(angle)*dist);
    mesh.rotation.y=-angle+Math.PI/2;
    group.add(mesh);
  }
  scene.add(group);
}

function makeCloud(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xe2e8f0,transparent:true,opacity:0.42,roughness:1});
  // Fewer, more separated puffs so it doesn’t look like a tight bunch
  const pieces = 3 + Math.floor(Math.random()*2);
  for(let i=0;i<pieces;i++){
    const s = 2.2 + Math.random()*3.5;
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 7, 7), mat);
    m.position.set(
      (Math.random()-0.5)*8,
      (Math.random()-0.5)*1.6,
      (Math.random()-0.5)*4
    );
    g.add(m);
  }
  return g;
}
for(let i=0;i<7;i++){
  const c = makeCloud();
  const a = (i / 7) * Math.PI * 2 + Math.random()*0.4;
  const d = 28 + Math.random()*12;
  c.position.set(Math.cos(a)*d, 13 + Math.random()*5, Math.sin(a)*d);
  c.userData.baseY = c.position.y;
  c.visible = false;
  cloudGroup.add(c);
}

const STAR_COUNT = 4500;

}

const shootingStars = [];
function spawnShootingStar() {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(6); // 2 points = streak
  const start = new THREE.Vector3(
    (Math.random()-0.5)*200,
    40 + Math.random()*60,
    (Math.random()-0.5)*200
  );
  const dir = new THREE.Vector3(Math.random()-0.5, -0.4-Math.random()*0.5, Math.random()-0.5).normalize();
  positions[0]=start.x; positions[1]=start.y; positions[2]=start.z;
  positions[3]=start.x+dir.x*18; positions[4]=start.y+dir.y*18; positions[5]=start.z+dir.z*18;
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.9 });
  const line = new THREE.Line(geo, mat);
  line.userData = { dir, life: 1.0, speed: 1.8 + Math.random()*1.5 };
  scene.add(line);
  shootingStars.push(line);
}
function updateShootingStars(dt) {
  for (let i = shootingStars.length-1; i >= 0; i--) {
    const s = shootingStars[i];
    const d = s.userData;
    d.life -= dt * 0.55;
    s.material.opacity = Math.max(0, d.life);
    const pos = s.geometry.attributes.position.array;
    for (let k = 0; k < 6; k += 3) {
      pos[k]   += d.dir.x * d.speed * dt * 60;
      pos[k+1] += d.dir.y * d.speed * dt * 60;
      pos[k+2] += d.dir.z * d.speed * dt * 60;
    }
    s.geometry.attributes.position.needsUpdate = true;
    if (d.life <= 0) {
      scene.remove(s);
      s.geometry.dispose();
      s.material.dispose();
      shootingStars.splice(i, 1);
    }
  }
}

// ========== HELPERS ==========
function getSeason(d){const m=((d%365)/30.4)|0; if(m>=2&&m<=4)return'spring'; if(m>=5&&m<=7)return'summer'; if(m>=8&&m<=10)return'fall'; return'winter';}
function pickDayWeather(d){
  const s=getSeason(d), r=Math.random();
  // Winter: only clear or snow — never rain
  if(s==='winter') return r<0.62 ? 'snow' : 'clear';
  if(s==='fall') return r<0.36?'rain':(r<0.5?'storm':'clear');
  if(s==='spring') return r<0.38?'rain':(r<0.5?'storm':'clear');
  return r<0.22?'rain':(r<0.32?'storm':'clear');
}
function getColors(d){
  const s=getSeason(d);
  if(s==='spring')return{trunk:0x4a3224,leaf:0x86efac,leaf2:0x4ade80,ground:0x3f4a3a,skyDay:0x38bdf8,skyDawn:0xfda4af};
  if(s==='summer')return{trunk:0x3f2a1c,leaf:0x22c55e,leaf2:0x16a34a,ground:0x3a4534,skyDay:0x0ea5e9,skyDawn:0xfdba74};
  if(s==='fall')return{trunk:0x5c3a1c,leaf:0xf97316,leaf2:0xea580c,ground:0x4a4035,skyDay:0xf59e0b,skyDawn:0xfb923c};
  return{trunk:0x44403c,leaf:0xa8a29e,leaf2:0x78716c,ground:0x4b5563,skyDay:0x94a3b8,skyDawn:0xe2e8f0};
}
function intensityMultiplier(){
  if (intensityLevel === 'normal') return 0.55;
  if (intensityLevel === 'super') return 2.6;
  return 1.3; // intense
}

function pickLeafMap() {
  const season = getSeason(day);
  if (season === 'winter') return leafTex.dead || null;
  if (season === 'fall') {
    const opts = [leafTex.fall_orange, leafTex.fall_red, leafTex.fall_yellow].filter(Boolean);
    return opts[(Math.random() * opts.length) | 0] || null;
  }
  if (season === 'spring') return leafTex.spring || null;
  return leafTex.summer || null;
}
function createLeafCard(color){
  const g=new THREE.Group();
  const geo=new THREE.PlaneGeometry(0.38,0.48);
  const map = (currentSpecies === 'maple') ? pickLeafMap() : null;
  const mat=new THREE.MeshStandardMaterial({
    color: map ? 0xffffff : color,
    map: map || null,
    roughness:0.65, metalness:0,
    side:THREE.DoubleSide, transparent:true, opacity:0.96,
    alphaTest: map ? 0.15 : 0
  });
  const p1=new THREE.Mesh(geo,mat), p2=new THREE.Mesh(geo,mat.clone()); p2.rotation.y=Math.PI/2;
  g.add(p1,p2); return g;
}
function addBranch(start,dir,length,depth,maxDepth,radius,colors,sp){
  if(depth>maxDepth)return;
  const end=start.clone().addScaledVector(dir,length);
  const curve=new THREE.LineCurve3(start,end);
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,1,radius,Math.max(5,9-depth),false),
    makeBarkMaterial(colors.trunk));
  mesh.castShadow=true; mesh.receiveShadow=true; treeGroup.add(mesh); branchMeshes.push(mesh);
  // Store outer branch tips for leaf regrowth
  if (depth >= 2) {
    branchTips.push({ start: start.clone(), end: end.clone(), depth });
  }

  const show = getSeason(day) !== 'winter';

  // Small twigs on mid-to-outer bigger branches
  if (depth >= 2 && depth <= maxDepth - 1 && length > 0.45) {
    const twigCount = 1 + Math.floor(Math.random() * 2);
    for (let t = 0; t < twigCount; t++) {
      const twigDir = dir.clone();
      const ang = Math.random() * Math.PI * 2;
      twigDir.x += Math.cos(ang) * (0.5 + Math.random() * 0.5);
      twigDir.z += Math.sin(ang) * (0.5 + Math.random() * 0.5);
      twigDir.y += 0.15 + Math.random() * 0.35;
      twigDir.normalize();
      const twigLen = length * (0.22 + Math.random() * 0.2);
      const twigStart = start.clone().lerp(end, 0.3 + Math.random() * 0.5);
      const twigEnd = twigStart.clone().addScaledVector(twigDir, twigLen);
      const twigCurve = new THREE.LineCurve3(twigStart, twigEnd);
      const twigMesh = new THREE.Mesh(
        new THREE.TubeGeometry(twigCurve, 1, radius * 0.28, 4, false),
        makeBarkMaterial(colors.trunk)
      );
      twigMesh.castShadow = true;
      treeGroup.add(twigMesh);
      branchMeshes.push(twigMesh);

      // A few leaves on twigs
      if (show && leafMeshes.length < targetLeafCount) {
        const lc = 1 + Math.floor(Math.random() * 2);
        for (let li = 0; li < lc; li++) {
          let col = Math.random() > 0.4 ? colors.leaf : colors.leaf2;
          if (sp.blossom && getSeason(day) === 'spring') col = Math.random() > 0.3 ? 0xf9a8d4 : 0xfbcfe8;
          const leaf = createLeafCard(col);
          const pos = twigStart.clone().lerp(twigEnd, 0.4 + Math.random() * 0.6);
          pos.x += (Math.random() - 0.5) * 0.25;
          pos.y += (Math.random() - 0.5) * 0.2;
          pos.z += (Math.random() - 0.5) * 0.25;
          leaf.position.copy(pos);
          leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
          leaf.scale.setScalar((0.45 + Math.random() * 0.35) * sp.leafSize);
          leaf.userData.basePos = pos.clone();
          leaf.userData.phase = Math.random() * Math.PI * 2;
          leaf.userData.amp = 0.5 + Math.random() * 0.9;
          treeGroup.add(leaf);
          leafMeshes.push(leaf);
        }
      }
    }
  }

  // Leaves ONLY on real branches (depth >= 2), never on trunk
  // Outer tips get more; thinner sides still get 1-3
  if (show && depth >= 2 && depth >= maxDepth - 3 && leafMeshes.length < targetLeafCount) {
    const isTip = depth >= maxDepth - 1;
    const tipFactor = isTip ? 1.35 : 0.75;
    // Sparse branches still get a few leaves
    const minLeaves = isTip ? 2 : 1;
    const count = Math.max(minLeaves, Math.min(
      Math.floor((2 + Math.random() * 3.5) * sp.leafDensity * tipFactor),
      targetLeafCount - leafMeshes.length
    ));
    for (let i = 0; i < count; i++) {
      let col = Math.random() > 0.4 ? colors.leaf : colors.leaf2;
      if (sp.blossom && getSeason(day) === 'spring') col = Math.random() > 0.3 ? 0xf9a8d4 : 0xfbcfe8;
      const leaf = createLeafCard(col);
      // Keep leaves toward the outer half of the branch segment
      const t = 0.45 + Math.random() * 0.55;
      const pos = start.clone().lerp(end, t);
      pos.x += (Math.random() - 0.5) * 0.4;
      pos.y += (Math.random() - 0.5) * 0.28;
      pos.z += (Math.random() - 0.5) * 0.4;
      leaf.position.copy(pos);
      leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
      leaf.scale.setScalar((0.52 + Math.random() * 0.45) * sp.leafSize);
      leaf.userData.basePos = pos.clone();
      leaf.userData.phase = Math.random() * Math.PI * 2;
      leaf.userData.amp = 0.5 + Math.random() * 0.95;
      treeGroup.add(leaf);
      leafMeshes.push(leaf);
    }
  }

  if (depth < maxDepth) {
    const n = depth === 0 ? 3 : (depth < 3 ? 3 : 2);
    for (let i = 0; i < n; i++) {
      const nd = dir.clone();
      const spread = (0.42 + Math.random() * 0.4) * sp.branchSpread;
      const ang = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.72;
      nd.x += Math.cos(ang) * spread;
      nd.z += Math.sin(ang) * spread;
      nd.y += sp.branchUpward + Math.random() * 0.32;
      nd.normalize();
      addBranch(end, nd, length * (0.6 + Math.random() * 0.23), depth + 1, maxDepth, radius * (0.59 + Math.random() * 0.1), colors, sp);
    }
  }
}
function calculateTargetLeaves(){
  const sp=SPECIES[currentSpecies], age=day/365, season=getSeason(day);
  let cap=Math.min(Math.floor(40+age*55*sp.leafDensity),280);
  if(season==='winter') {
    // Heart of winter: 0–5 leaves max, all "dead"
    targetLeafCount = Math.min(5, Math.floor(cap * 0.02));
  } else if(season==='fall'){
    // Gradual drop through fall
    const dayInYear = day % 365;
    const fallProgress = Math.min(1, Math.max(0, (dayInYear - 240) / 90));
    targetLeafCount = Math.floor(cap * Math.max(0.05, 1 - fallProgress * 0.95));
  } else {
    targetLeafCount = cap;
  }
}
function rebuildTree(){
  fallingLeaves.forEach(l=>scene.remove(l)); fallingLeaves=[];
  // Clear most ground leaves on rebuild during winter/spring
  if (getSeason(day) === 'winter') clearGroundLeaves(1);
  else if (getSeason(day) === 'spring') clearGroundLeaves(0);
  if(treeGroup){scene.remove(treeGroup); treeGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());});}
  branchMeshes=[]; leafMeshes=[]; branchTips=[]; treeGroup=new THREE.Group(); treeGroup.scale.setScalar(0.55); scene.add(treeGroup);
  calculateTargetLeaves();
  const colors=getColors(day), sp=SPECIES[currentSpecies], age=day/365;
  const maxDepth=Math.min(2+Math.floor(age*sp.growthRate/4.2),6); // slower branching complexity
  const baseLen=0.85+Math.min(age*0.37*sp.growthRate,sp.maxHeight*0.52);
  const baseRad=0.11+Math.min(age*0.023*sp.growthRate,0.31);
  colors.trunk=sp.trunkColor;
  addBranch(new THREE.Vector3(),new THREE.Vector3(0,1,0),baseLen,0,maxDepth,baseRad,colors,sp);
  ground.material.color.setHex(colors.ground);
  spawnSeasonalFlowers();
  lockCameraToTree();
}

function updateLeafColors() {
  const season = getSeason(day);
  const sp = SPECIES[currentSpecies];
  const colors = getColors(day);
  leafMeshes.forEach(leaf => {
    leaf.traverse(c => {
      if (c.isMesh && c.material && c.material.color) {
        if (season === 'winter') {
          // Dead leaves – brown / gray-brown
          c.material.color.setHex(Math.random() > 0.5 ? 0x6b4c2a : 0x5c4033);
        } else if (season === 'fall') {
          // Fall colors – orange / red / yellow for maple-like
          const fallColors = [0xf97316, 0xea580c, 0xfbbf24, 0xdc2626, 0xb45309];
          c.material.color.setHex(fallColors[(Math.random() * fallColors.length) | 0]);
        }
        // spring/summer keep their original green (set at creation)
      }
    });
  });
}

function shedLeavesGradually(){
  calculateTargetLeaves();
  const excess=leafMeshes.length-targetLeafCount;
  if(excess<=0)return;
  const toShed=Math.min(excess,1+Math.floor(Math.random()*2));
  for(let i=0;i<toShed;i++){
    if(!leafMeshes.length)break;
    const idx=(Math.random()*leafMeshes.length)|0;
    const leaf=leafMeshes.splice(idx,1)[0];
    treeGroup.remove(leaf); scene.add(leaf);
    leaf.userData.vx=(Math.random()-0.5)*0.06*windStrength;
    leaf.userData.vy=-0.015-Math.random()*0.025;
    leaf.userData.vz=(Math.random()-0.5)*0.06*windStrength;
    leaf.userData.rot=(Math.random()-0.5)*0.16; leaf.userData.life=1;
    fallingLeaves.push(leaf);
  }
}

// Regrow leaves onto existing branches when target goes up (spring etc.)
function regrowLeavesGradually() {
  calculateTargetLeaves();
  if (getSeason(day) === 'winter') return;
  if (leafMeshes.length >= targetLeafCount) return;
  if (branchTips.length === 0) return;

  const sp = SPECIES[currentSpecies];
  const colors = getColors(day);
  const need = targetLeafCount - leafMeshes.length;
  const toAdd = Math.min(need, 2 + Math.floor(Math.random() * 3));

  for (let i = 0; i < toAdd; i++) {
    const tip = branchTips[(Math.random() * branchTips.length) | 0];
    let col = Math.random() > 0.4 ? colors.leaf : colors.leaf2;
    if (sp.blossom && getSeason(day) === 'spring') col = Math.random() > 0.3 ? 0xf9a8d4 : 0xfbcfe8;
    const leaf = createLeafCard(col);
    const t = 0.45 + Math.random() * 0.55;
    const pos = tip.start.clone().lerp(tip.end, t);
    pos.x += (Math.random() - 0.5) * 0.4;
    pos.y += (Math.random() - 0.5) * 0.28;
    pos.z += (Math.random() - 0.5) * 0.4;
    leaf.position.copy(pos);
    leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    // Bud / sprout – start small
    const fullScale = (0.52 + Math.random() * 0.45) * sp.leafSize;
    leaf.scale.setScalar(fullScale * 0.12);
    leaf.userData.basePos = pos.clone();
    leaf.userData.phase = Math.random() * Math.PI * 2;
    leaf.userData.amp = 0.5 + Math.random() * 0.95;
    leaf.userData.fullScale = fullScale;
    leaf.userData.sprout = 0.12; // grows toward 1
    treeGroup.add(leaf);
    leafMeshes.push(leaf);
  }
}

function clearGroundLeaves(keepMax = 2) {
  while (groundLeafMeshes.length > keepMax) {
    const old = groundLeafMeshes.shift();
    scene.remove(old);
  }
}

function updateFalling(dt){
  for(let i=fallingLeaves.length-1;i>=0;i--){
    const l=fallingLeaves[i], u=l.userData;
    u.vy-=0.0021*dt*60; u.vx+=(Math.random()-0.5)*0.002*windStrength; u.vz+=(Math.random()-0.5)*0.002*windStrength;
    l.position.x+=u.vx*dt*60; l.position.y+=u.vy*dt*60; l.position.z+=u.vz*dt*60;
    l.rotation.x+=u.rot*dt*60; l.rotation.z+=u.rot*0.7*dt*60;
    if(l.position.y<0.08){
      l.position.y=0.02+Math.random()*0.03; l.rotation.x=Math.PI/2+(Math.random()-0.5)*0.5;
      groundLeafMeshes.push(l); fallingLeaves.splice(i,1);
      if(groundLeafMeshes.length>120){const old=groundLeafMeshes.shift(); scene.remove(old);}
    }
  }
}

function createBookLeaf() {
  if (bookLeafGroup) {
    scene.remove(bookLeafGroup);
    bookLeafGroup = null;
    bookLeafMesh = null;
  }
  bookLeafGroup = new THREE.Group();
  // Tiny hardcover book
  const cover = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.30, 0.05),
    new THREE.MeshStandardMaterial({
      color: 0x0d1f33,
      emissive: 0x1e90c0,
      emissiveIntensity: 0.45,
      metalness: 0.15,
      roughness: 0.55
    })
  );
  const page = new THREE.Mesh(
    new THREE.BoxGeometry(0.20, 0.28, 0.03),
    new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.85 })
  );
  page.position.z = 0.02;
  bookLeafGroup.add(cover);
  bookLeafGroup.add(page);
  bookLeafMesh = cover;
  bookLeafGroup.userData.isBookLeaf = true;
  placeBookLeafOnTree();
  scene.add(bookLeafGroup);
  bookLeafDetached = false;
  bookLeafHover = false;
}

function placeBookLeafOnTree() {
  if (!bookLeafGroup || !treeGroup) return;
  // Attach near upper canopy – use tree scale / height estimate
  const sp = SPECIES[currentSpecies];
  const age = cinematicMode ? cinematicTreeAge / 365 : day / 365;
  const h = 0.35 + (sp.maxHeight - 0.8) * (1 - Math.exp(-age / (7.0 / sp.growthRate))) * sp.growthRate;
  const s = treeGroup.scale.x || 1;
  bookLeafGroup.position.set(0.55 * s, Math.max(1.2, h * 0.72 * s), 0.35 * s);
  bookLeafGroup.rotation.set(-0.4, 0.5, -0.35);
  bookLeafGroup.scale.setScalar(Math.max(0.7, Math.min(1.4, s)));
}

function detachBookLeaf() {
  if (!bookLeafGroup || bookLeafDetached) return;
  bookLeafDetached = true;
  bookLeafGroup.userData.vel = new THREE.Vector3(0.01, -0.02, 0.005);
  bookLeafGroup.userData.spin = new THREE.Vector3(0.04, 0.08, 0.03);
  bookLeafGroup.userData.phase = 'falling';
}

function updateBookLeaf(dt) {
  if (!bookLeafGroup) return;
  if (!bookLeafDetached) {
    placeBookLeafOnTree();
    // gentle glow pulse
    if (bookLeafMesh && bookLeafMesh.material) {
      bookLeafMesh.material.emissiveIntensity = 0.35 + 0.2 * Math.sin(performance.now() * 0.003);
    }
    return;
  }
  const g = bookLeafGroup;
  if (g.userData.phase === 'falling') {
    g.position.add(g.userData.vel.clone().multiplyScalar(dt * 60));
    g.userData.vel.y -= 0.0012 * dt * 60;
    g.rotation.x += g.userData.spin.x * dt * 60;
    g.rotation.y += g.userData.spin.y * dt * 60;
    g.rotation.z += g.userData.spin.z * dt * 60;
    // settle to hover under tree
    if (g.position.y <= 1.35) {
      g.position.y = 1.35;
      g.userData.phase = 'hover';
      g.userData.vel.set(0, 0, 0);
      bookLeafHover = true;
      try {
        window.parent && window.parent.postMessage({ type: 'book-leaf', state: 'hover' }, '*');
      } catch (e) {}
    }
  } else if (g.userData.phase === 'hover') {
    g.position.y = 1.35 + Math.sin(performance.now() * 0.002) * 0.06;
    g.rotation.y += 0.008;
    if (bookLeafMesh && bookLeafMesh.material) {
      bookLeafMesh.material.emissiveIntensity = 0.5 + 0.25 * Math.sin(performance.now() * 0.004);
    }
  }
}

function cinematicTick() {
  // Dual clocks: tree ages fast, weather day cycles medium
  if (!cinematicMode) return;
  cinematicTreeAge += 20; // ~20 days per tick
  day = Math.max(1, Math.floor(cinematicTreeAge));
  if (treeGroup) {
    const sp = SPECIES[currentSpecies];
    const age = cinematicTreeAge / 365;
    const targetScale = 0.7 + Math.min(age * 1.1 * sp.growthRate, 2.2);
    treeGroup.scale.setScalar(targetScale);
  }
  // weather clock: cycle time of day faster for sky drama
  timeOfDay += 0.35;
  if (timeOfDay >= 24) {
    timeOfDay -= 24;
    dayWeatherType = pickDayWeather(Math.floor(cinematicTreeAge));
  }
  // force mist-ish morning at start
  if (cinematicTreeAge < 25) {
    timeOfDay = 5.5 + (cinematicTreeAge / 25) * 2;
    currentWeather = 'clear';
  }
  calculateTargetLeaves();
  // soft rebuild rarely for structure growth feel
  if (Math.floor(cinematicTreeAge) % 40 < 20 && Math.floor(cinematicTreeAge) % 40 > 17) {
    // scale only — updateTreeScale handles visual growth
  }
  placeBookLeafOnTree();
  updateAtmosphere();
  updateLabels();
}

}

// Morning mist – very fine, dense, background only
mistSys = makeParticles(1800, 0xdbeafe, 0.04, -0.004, 40);
mistSys.material.opacity = 0.35;
mistSys.material.depthWrite = false;
mistSys.material.transparent = true;

function tickParticles(sys,str,extraY=1){
  if(!sys || !sys.visible)return;
  const arr=sys.geometry.attributes.position.array, vel=sys.userData.vel;
  const drift = sys.userData.drift || 1;
  const spread = 70;
  for(let i=0;i<vel.length;i++){
    arr[i*3]+=vel[i].x*str*drift*1.8;
    arr[i*3+1]+=vel[i].y*extraY;
    arr[i*3+2]+=(vel[i].x*0.4)*str*drift;
    if(arr[i*3+1]<0){
      arr[i*3+1]=12+Math.random()*18;
      arr[i*3]=(Math.random()-0.5)*spread;
      arr[i*3+2]=(Math.random()-0.5)*spread;
    }
  }
  sys.geometry.attributes.position.needsUpdate=true;
}

// Atmosphere
function updateAtmosphere(){
  const t=timeOfDay, colors=getColors(day), im=intensityMultiplier();
  const sunAngle=((t-6)/12)*Math.PI;
  sunMesh.position.set(Math.cos(sunAngle)*54, Math.sin(sunAngle)*46, -20);
  sunLight.position.copy(sunMesh.position).normalize().multiplyScalar(30);
  const moonAngle=sunAngle+Math.PI;
  moonMesh.position.set(Math.cos(moonAngle)*46, Math.sin(moonAngle)*40, 16);
  moonLight.position.copy(moonMesh.position).normalize().multiplyScalar(24);

  let dayFactor=0;
  if(t>5.4&&t<20.6){dayFactor=Math.sin(((t-5.4)/15.2)*Math.PI); dayFactor=Math.pow(Math.max(0,dayFactor),0.82);}
  sunLight.intensity=dayFactor*1.6; sunLight.visible=dayFactor>0.04;

  // ----- Moon phase (0 = new, 1 = full) based on day of year -----
  // Simple 29.5-day lunar cycle
  const lunarPhase = ((day % 29.5) / 29.5);           // 0 → 1
  const moonPhaseStrength = 0.5 - 0.5 * Math.cos(lunarPhase * Math.PI * 2); // 0 at new, 1 at full

  // Base night brightness from stars + moon
  let nightBright = 0.14 + moonPhaseStrength * 0.22;  // stars keep it from being pitch black

  // Weather modifiers at night
  if (dayFactor < 0.35) {
    if (currentWeather === 'rain' || currentWeather === 'storm') {
      // Summer rainy nights feel darker
      if (getSeason(day) === 'summer') nightBright *= 0.55;
      else nightBright *= 0.7;
    }
    if (currentWeather === 'snow') {
      // Snow reflects light – nights stay brighter even though it’s dark
      nightBright *= 1.45;
    }
  }

  moonLight.visible = dayFactor < 0.45;
  moonLight.intensity = (1 - dayFactor) * (0.12 + moonPhaseStrength * 0.32);
  hemi.intensity = 0.18 + dayFactor * 0.4;
  ambientNight.intensity = (1 - dayFactor) * nightBright;
  // Stars – denser on clear nights with intensity
  let starOpacity = Math.max(0, (1 - dayFactor * 1.9));
  if (currentWeather === 'clear' && dayFactor < 0.35) {
    if (intensityLevel === 'intense') { starOpacity = Math.min(1, starOpacity * 1.6); starMat.size = 0.38; }
    else if (intensityLevel === 'super') { starOpacity = 1; starMat.size = 0.5; if (Math.random() < 0.01) spawnShootingStar(); }
    else { starMat.size = 0.28; }
  } else {
    starMat.size = 0.26;
  }
  if (currentWeather === 'storm' || currentWeather === 'rain') starOpacity *= 0.2;
  if (currentWeather === 'snow') starOpacity *= 0.4;
  starMat.opacity = Math.min(1, Math.max(0, starOpacity));

  // Moon appearance
  moonMesh.visible = dayFactor < 0.6;
  const moonGlow = (1 - dayFactor) * (0.15 + moonPhaseStrength * 0.4);
  moonMesh.material.emissive = new THREE.Color(0x94a3b8);
  moonMesh.material.emissiveIntensity = moonGlow;
  // Swap moon phase texture
  if (moonPhaseTex && moonPhaseTex.full) {
    const phaseNames = ['new','waxing_crescent','first_quarter','waxing_gibbous','full','waning_gibbous','last_quarter','waning_crescent'];
    const idx = Math.min(7, Math.floor(lunarPhase * 8)) % 8;
    const tex = moonPhaseTex[phaseNames[idx]];
    if (tex) {
      if (moonMesh.material.map !== tex) {
        moonMesh.material.map = tex;
        moonMesh.material.needsUpdate = true;
      }
      moonMesh.material.color.setHex(0xffffff);
      moonMesh.material.emissive = new THREE.Color(0x1e293b);
      moonMesh.material.emissiveIntensity = 0.15 + moonPhaseStrength * 0.35;
      moonMesh.material.roughness = 1;
      moonMesh.material.metalness = 0;
    }
  }
  // Scale moon slightly with phase for visual feedback
  const moonScale = 0.75 + moonPhaseStrength * 0.35;
  moonMesh.scale.setScalar(moonScale);

  const dawnDusk=Math.max(0,1-Math.abs(t-6.1)*0.65)+Math.max(0,1-Math.abs(t-18.6)*0.65);
  const sky=new THREE.Color().copy(new THREE.Color(colors.skyDay));
  if(dawnDusk>0.08)sky.lerp(new THREE.Color(colors.skyDawn),Math.min(1,dawnDusk));
  if(dayFactor<0.28)sky.lerp(new THREE.Color(0x0c1525),1-dayFactor*3.5);
  // Rain / thunderstorm: overcast gray-white nimbus sky (not snow white-out)
  if (currentWeather === 'rain') {
    const overcast = intensityLevel === 'super' ? 0.75 : intensityLevel === 'intense' ? 0.55 : 0.35;
    sky.lerp(new THREE.Color(0x9ca3af), overcast); // soft gray
  } else if (currentWeather === 'storm') {
    sky.lerp(new THREE.Color(0x6b7280), 0.7); // darker storm gray
  }
  scene.background=sky; scene.fog.color.copy(sky);

  // Fog – heavy wave fog ONLY for snow. Rain gets light haze + gray sky instead.
  let fogDensity = 0.006;
  if (t > 4.6 && t < 9.0) {
    const m = 1 - Math.abs(t - 6.6) / 2.5;
    fogDensity += Math.max(0, m) * 0.02;
  }

  if (currentWeather === 'snow') {
    // Living wave fog – snow only
    const time = performance.now() * 0.001;
    const wave1 = 0.5 + 0.5 * Math.sin(time * 0.15);
    const wave2 = 0.5 + 0.5 * Math.sin(time * 0.33 + 1.7);
    const wave3 = 0.5 + 0.5 * Math.sin(time * 0.07 + 4.2);
    const wave = (wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2);
    let base = 0.018, amplitude = 0.012;
    if (intensityLevel === 'intense') { base = 0.055; amplitude = 0.04; }
    if (intensityLevel === 'super')   { base = 0.085; amplitude = 0.06; }
    fogDensity += base + amplitude * wave;
  } else if (currentWeather === 'rain' || currentWeather === 'storm') {
    // Light atmospheric haze only – no white-out
    fogDensity += 0.004 + 0.003 * im;
  }

  scene.fog.density = fogDensity;
  // Fog COLOR: mist/snow must not equal sky or it disappears
  if (currentWeather === 'snow') {
    const white = new THREE.Color(0xe8eef5);
    const skyC = scene.background.clone();
    const mix = intensityLevel === 'super' ? 0.82 : intensityLevel === 'intense' ? 0.65 : 0.45;
    scene.fog.color.copy(skyC).lerp(white, mix);
  } else if (currentWeather === 'rain' || currentWeather === 'storm') {
    scene.fog.color.copy(scene.background).lerp(new THREE.Color(0x9ca3af), 0.35);
  } else if (t > 4.6 && t < 9.0) {
    // morning mist — cool pale, not pure sky
    scene.fog.color.copy(scene.background).lerp(new THREE.Color(0xdbe4f0), 0.4);
  } else {
    scene.fog.color.copy(scene.background);
  }
  // Tree shadow fades as snow thickens (real life)
  if (typeof sunLight !== 'undefined') {
    if (currentWeather === 'snow') {
      const fade = intensityLevel === 'super' ? 0.05 : intensityLevel === 'intense' ? 0.25 : 0.55;
      sunLight.castShadow = fade > 0.15;
      sunLight.intensity = Math.min(sunLight.intensity, 0.35 + fade * 0.5);
    }
  }
  // Ground snow cover
  if (typeof snowCover !== 'undefined') {
    const season = getSeason(day);
    let snowOp = 0;
    if (season === 'winter') snowOp = 0.85;
    else if (currentWeather === 'snow') snowOp = 0.55 + 0.3 * (intensityLevel === 'super' ? 1 : intensityLevel === 'intense' ? 0.6 : 0.3);
    else if (season === 'fall' && currentWeather === 'snow') snowOp = 0.35;
    snowCover.material.opacity = snowOp;
    snowCover.visible = snowOp > 0.05;
  }


  // Weather – mutually exclusive + winter never rains
  if (getSeason(day) === 'winter' && (dayWeatherType === 'rain' || dayWeatherType === 'storm')) {
    dayWeatherType = 'snow';
  }
  if(dayWeatherType==='clear'){weatherIntensity=0; currentWeather='clear';}
  else{
    weatherIntensity=Math.max(0.2,Math.sin(((t-5)/14)*Math.PI)*0.95);
    currentWeather=dayWeatherType;
    // Promote rain → storm when intensity is super
    if (currentWeather === 'rain' && intensityLevel === 'super') currentWeather = 'storm';
  }

  // Particles – never rain + snow together
  rainSys.visible=(currentWeather==='rain'||currentWeather==='storm')&&weatherIntensity>0.12;
  const isSnow=currentWeather==='snow'&&weatherIntensity>0.12;
  snowBigSys.visible=isSnow;
  snowSmallSys.visible=isSnow;
  if (isSnow) {
    const op = intensityLevel === 'super' ? 0.95 : intensityLevel === 'intense' ? 0.85 : 0.7;
    snowBigSys.material.opacity = op;
    snowSmallSys.material.opacity = op * 0.9;
    // more horizontal drift in blizzard
    const drift = intensityLevel === 'super' ? 2.2 : intensityLevel === 'intense' ? 1.4 : 0.8;
    snowBigSys.userData.drift = drift;
    snowSmallSys.userData.drift = drift * 1.3;
  }
  // Morning mist: fog does the atmosphere – particles almost gone
  const isMorningMistHours = (t >= 5.0 && t <= 8.0);
  // Only show tiny residual particles when far away, never in snow (snow has its own)
  const showMistParticles = isMorningMistHours && currentWeather === 'clear';
  mistSys.visible = showMistParticles;
  if (showMistParticles) {
    const dist = camera.position.length();
    const mistFade = Math.max(0, Math.min(1, (dist - 12) / 20));
    // Extremely subtle – almost no visible particles
    mistSys.material.opacity = 0.04 * mistFade;
  }

  // Clouds only with rain/snow – density follows intensity
  const showClouds = (currentWeather === 'rain' || currentWeather === 'storm' || currentWeather === 'snow');
  const totalClouds = cloudGroup.children.length;
  // How many clouds to show
  let cloudCount = 0;
  if (showClouds) {
    if (intensityLevel === 'normal') cloudCount = Math.floor(totalClouds * 0.35);
    else if (intensityLevel === 'intense') cloudCount = Math.floor(totalClouds * 0.7);
    else cloudCount = totalClouds; // super / thunderstorm / blizzard = all clouds
    if (currentWeather === 'storm') cloudCount = totalClouds; // always max on storm
  }
  cloudGroup.children.forEach((c, i) => {
    c.visible = showClouds && i < cloudCount;
    if (c.visible) {
      c.position.y = c.userData.baseY + Math.sin(performance.now()*0.00025 + i)*0.35;
      c.traverse(m => {
        if (m.material) {
          if (currentWeather === 'storm') {
            m.material.color.setHex(0x6b7280); // dark nimbus
            m.material.opacity = 0.72;
          } else if (currentWeather === 'rain') {
            m.material.color.setHex(0x9ca3af); // light gray fluffy
            m.material.opacity = intensityLevel === 'super' ? 0.65 :
                                 intensityLevel === 'intense' ? 0.5 : 0.38;
          } else if (currentWeather === 'snow') {
            m.material.color.setHex(0xe2e8f0);
            m.material.opacity = intensityLevel === 'super' ? 0.55 : 0.4;
          }
        }
      });
    }
  });

  if(currentWeather==='storm')windStrength=0.9+weatherIntensity*0.8*im;
  else if(currentWeather==='rain')windStrength=0.45+weatherIntensity*0.4*im;
  else if(currentWeather==='snow')windStrength=0.3+weatherIntensity*0.35*im;
  else windStrength=0.18+Math.sin(t*0.3)*0.08;

  updateAudio();
}

// UI
function formatTime(t){
  let h = Math.floor(t) % 24;
  const m = Math.floor((t % 1) * 60);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}
function updateLabels(){
  document.getElementById('dayLabel').textContent=day;
  document.getElementById('timeLabel').textContent=formatTime(timeOfDay);
  document.getElementById('speciesLabel').textContent=SPECIES[currentSpecies].name;
  document.getElementById('seasonLabel').textContent=getSeason(day)[0].toUpperCase()+getSeason(day).slice(1);
  document.getElementById('weatherLabel').textContent=currentWeather[0].toUpperCase()+currentWeather.slice(1);
  let intenLabel = '—';
  if (currentWeather === 'rain' || currentWeather === 'storm') {
    intenLabel = intensityLevel === 'normal' ? 'Light Rain' :
                 intensityLevel === 'intense' ? 'Heavy Rain' : 'Thunderstorm';
  } else if (currentWeather === 'snow') {
    intenLabel = intensityLevel === 'normal' ? 'Light Snow' :
                 intensityLevel === 'intense' ? 'Major Snow' : 'Blizzard';
  } else if (currentWeather === 'clear') {
    intenLabel = intensityLevel === 'normal' ? 'Clear' :
                 intensityLevel === 'intense' ? 'Crisp Clear' : 'Deep Clear';
  }
  document.getElementById('intensityLabel').textContent = intenLabel;
  document.getElementById('leafLabel').textContent=leafMeshes.length+' / '+targetLeafCount;
  const sp=SPECIES[currentSpecies],age=day/365;
  document.getElementById('heightLabel').textContent=(0.35+(sp.maxHeight-0.8)*(1-Math.exp(-age/(7/sp.growthRate)))*sp.growthRate).toFixed(2)+' m';
  lockCameraToTree();
  let statusWeather = currentWeather;
  if (currentWeather === 'rain' || currentWeather === 'storm') {
    statusWeather = intensityLevel === 'normal' ? 'light rain' :
                    intensityLevel === 'intense' ? 'heavy rain' : 'thunderstorm';
  } else if (currentWeather === 'snow') {
    statusWeather = intensityLevel === 'normal' ? 'light snow' :
                    intensityLevel === 'intense' ? 'major snow' : 'blizzard';
  }
  document.getElementById('status').textContent = `${formatTime(timeOfDay)} • ${statusWeather} • Day ${day}`;
}

function advanceTime(hours){
  timeOfDay+=hours;
  while(timeOfDay>=24){
    timeOfDay-=24;
    day++;
    dayWeatherType=pickDayWeather(day);
    const season = getSeason(day);
    // When we enter winter or spring, clear most fallen leaves
    if (season === 'winter' || season === 'spring') {
      clearGroundLeaves(season === 'winter' ? 1 : 0);
    }
    if(day%1400<1) rebuildTree(); // only every ~4 years – very rare
    else calculateTargetLeaves();
  }
  updateAtmosphere(); updateLabels();
}

document.getElementById('hourBtn').onclick=()=>{
  if(isTimelapsing)return;
  tryEnableAudio();
  advanceTime(1);
  shedLeavesGradually();
  updateAtmosphere();
  updateLabels();
};

document.getElementById('growBtn').onclick=()=>{
  if(isTimelapsing)return; tryEnableAudio();
  const prevSeason = getSeason(day);
  for(let i=0;i<7*speedMultiplier;i++){day++;dayWeatherType=pickDayWeather(day);calculateTargetLeaves();}
  const newSeason = getSeason(day);
  if (newSeason === 'winter' || newSeason === 'spring') {
    clearGroundLeaves(newSeason === 'winter' ? 1 : 0);
  }
  for(let k=0;k<6;k++)shedLeavesGradually();
  if(day%1100<7)rebuildTree(); // rare structural change updateAtmosphere(); updateLabels();
};
document.getElementById('timelapseBtn').onclick=async()=>{
  if(isTimelapsing)return; tryEnableAudio(); isTimelapsing=true;
  for(let i=0;i<48;i++){advanceTime(0.55*speedMultiplier);shedLeavesGradually();await new Promise(r=>setTimeout(r,speedMultiplier===2?16:26));}
  isTimelapsing=false;
};
document.getElementById('weatherBtn').onclick=()=>{
  tryEnableAudio();
  const season = getSeason(day);
  // In winter only cycle between clear and snow
  const options = season === 'winter'
    ? ['clear', 'snow']
    : ['clear', 'rain', 'storm', 'snow'];
  let idx = options.indexOf(dayWeatherType);
  if (idx === -1) idx = 0;
  dayWeatherType = options[(idx + 1) % options.length];
  currentWeather = dayWeatherType;
  updateAtmosphere();
  updateLabels();
};
document.getElementById('intensityBtn').onclick=()=>{
  tryEnableAudio();
  const o=['normal','intense','super'];
  intensityLevel=o[(o.indexOf(intensityLevel)+1)%3];
  updateAtmosphere();
  updateLabels();
  // Force star refresh immediately
  if (stars && starMat) {
    const t = timeOfDay;
    let dayFactor = 0;
    if (t > 5.4 && t < 20.6) {
      dayFactor = Math.sin(((t - 5.4) / 15.2) * Math.PI);
      dayFactor = Math.pow(Math.max(0, dayFactor), 0.82);
    }
    if (currentWeather === 'clear' && dayFactor < 0.35) {
      if (intensityLevel === 'super') { starMat.opacity = 1; starMat.size = 3.2; }
      else if (intensityLevel === 'intense') { starMat.opacity = 0.95; starMat.size = 2.6; }
      else { starMat.opacity = 0.8; starMat.size = 2.1; }
    }
  }
};
document.getElementById('speciesBtn').onclick=()=>{tryEnableAudio();const o=['maple','oak','birch','cherry'];currentSpecies=o[(o.indexOf(currentSpecies)+1)%4];document.getElementById('speciesBtn').textContent=SPECIES[currentSpecies].name;rebuildTree();updateLabels();};
document.getElementById('speedBtn').onclick=()=>{speedMultiplier=speedMultiplier===1?2:1;const b=document.getElementById('speedBtn');if(speedMultiplier===2){b.classList.add('active');b.textContent='2× ON';}else{b.classList.remove('active');b.textContent='2×';}};
document.getElementById('muteBtn').onclick=()=>{muted=!muted;document.getElementById('muteBtn').textContent=muted?'Unmute':'Mute';if(masterGain)masterGain.gain.value=muted?0:0.55;document.getElementById('status').textContent=muted?'Audio MUTED':'Audio ON';};
document.getElementById('resetCamBtn').onclick=()=>{camera.position.set(9.5, 5.2, 12.5);controls.target.set(0,2.8,0);};

// Loop
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(!isTimelapsing){timeOfDay+=dt*0.01*speedMultiplier;if(timeOfDay>=24){timeOfDay-=24;day++;dayWeatherType=pickDayWeather(day);calculateTargetLeaves();}updateAtmosphere();}
  controls.update();

  tickParticles(rainSys,windStrength);
  tickParticles(snowBigSys, windStrength*0.5, 0.5);  // big flakes - slow float
  tickParticles(snowSmallSys, windStrength*1.5, 0.9); // fine particles - more drift
  tickParticles(mistSys,0.35);
  leafMeshes.forEach(leaf=>{
    // Sprout growth
    if (leaf.userData.sprout !== undefined && leaf.userData.sprout < 1) {
      leaf.userData.sprout = Math.min(1, leaf.userData.sprout + 0.006);
      const s = leaf.userData.fullScale * leaf.userData.sprout;
      leaf.scale.setScalar(s);
    }
    const p=leaf.userData.phase,a=leaf.userData.amp*windStrength;
    const wx=Math.sin(t*1.5+p)*0.06*a, wz=Math.cos(t*1.15+p*0.8)*0.05*a, wy=Math.sin(t*2+p*1.3)*0.028*a;
    if (leaf.userData.basePos) {
      leaf.position.x=leaf.userData.basePos.x+wx; leaf.position.y=leaf.userData.basePos.y+wy; leaf.position.z=leaf.userData.basePos.z+wz;
    }
    leaf.rotation.z=wx*3.3; leaf.rotation.x=wy*4;
  });
  branchMeshes.forEach((b,i)=>{if(i>7)b.rotation.z=Math.sin(t*0.55+i*0.3)*0.015*windStrength;});
  waterMesh.position.y=0.03+Math.sin(t*0.65)*0.007;
  if(Math.random()<0.035)shedLeavesGradually();
  if(Math.random()<0.04)regrowLeavesGradually();
  if(Math.random()<0.01) updateLeafColors();
  // Slowly clean up ground leaves, especially in winter
  if (getSeason(day) === 'winter' && groundLeafMeshes.length > 2 && Math.random() < 0.02) {
    const old = groundLeafMeshes.shift();
    if (old) scene.remove(old);
  }
  updateFalling(dt); updateShootingStars(dt); updateTreeScale(); if(typeof updateBookLeaf==='function')updateBookLeaf(dt); updateLabels();
  if (stars) stars.position.copy(camera.position);
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

dayWeatherType=pickDayWeather(day);
rebuildTree(); updateAtmosphere(); updateLabels(); animate();

// ===== EXTERNAL BRIDGE (book site / parent frame) =====
window.addEventListener('message', (ev) => {
  const data = ev.data;
  if (!data || data.type !== 'tree-cmd') return;
  try {
    const cmd = data.cmd;
    if (cmd === 'setDay' && typeof data.day === 'number') {
      day = Math.max(1, data.day|0);
      dayWeatherType = pickDayWeather(day);
      calculateTargetLeaves();
      if (typeof rebuildTree === 'function') { /* don't rebuild unless forced */ }
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'setTime' && typeof data.time === 'number') {
      timeOfDay = ((data.time % 24) + 24) % 24;
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'setWeather' && data.weather) {
      dayWeatherType = data.weather;
      currentWeather = data.weather;
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'setIntensity' && data.level) {
      intensityLevel = data.level;
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'advanceHours' && typeof data.hours === 'number') {
      if (typeof advanceTime === 'function') advanceTime(data.hours);
      else {
        timeOfDay += data.hours;
        while (timeOfDay >= 24) { timeOfDay -= 24; day++; dayWeatherType = pickDayWeather(day); }
        updateAtmosphere(); updateLabels();
      }
    }
    if (cmd === 'advanceDays' && typeof data.days === 'number') {
      for (let i = 0; i < data.days; i++) {
        day++; dayWeatherType = pickDayWeather(day); calculateTargetLeaves();
      }
      if (typeof shedLeavesGradually === 'function') for (let k=0;k<5;k++) shedLeavesGradually();
      if (typeof regrowLeavesGradually === 'function') for (let k=0;k<8;k++) regrowLeavesGradually();
      if (typeof updateLeafColors === 'function') updateLeafColors();
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'setCamera' && data.pos && camera) {
      camera.position.set(data.pos.x, data.pos.y, data.pos.z);
      if (data.target && controls) controls.target.set(data.target.x, data.target.y, data.target.z);
      if (controls) controls.update();
    }
    
    if (cmd === 'cinematicStart') {
      cinematicMode = true;
      cinematicTreeAge = 1;
      day = 1;
      timeOfDay = 5.5;
      dayWeatherType = 'clear';
      currentWeather = 'clear';
      intensityLevel = 'normal';
      bookLeafDetached = false;
      bookLeafHover = false;
      rebuildTree();
      createBookLeaf();
      if (camera) camera.position.set(5.2, 2.4, 7.2);
      if (controls) { controls.target.set(0, 0.9, 0); controls.update(); }
      updateAtmosphere(); updateLabels();
    }
    if (cmd === 'cinematicTick') {
      cinematicTick();
    }
    if (cmd === 'cinematicEnd') {
      cinematicMode = false;
      day = 140;
      cinematicTreeAge = 140;
      timeOfDay = 22.2;
      dayWeatherType = 'clear';
      currentWeather = 'clear';
      intensityLevel = 'super';
      calculateTargetLeaves();
      placeBookLeafOnTree();
      if (camera) camera.position.set(8.5, 4.2, 11.5);
      if (controls) { controls.target.set(0, 1.8, 0); controls.update(); }
      // ensure UI hidden at end for book shell
      const uiEl = document.getElementById('ui');
      if (uiEl) uiEl.style.display = 'none';
      updateAtmosphere(); updateLabels();
      try { window.parent && window.parent.postMessage({ type: 'book-leaf', state: 'ready' }, '*'); } catch (e) {}
    }
    if (cmd === 'detachBook') {
      detachBookLeaf();
    }
    if (cmd === 'bookProximity') {
      // parent asks if hover and camera close
      let close = false;
      if (bookLeafGroup && bookLeafHover && camera) {
        close = camera.position.distanceTo(bookLeafGroup.position) < 6.5;
      }
      try { window.parent && window.parent.postMessage({ type: 'book-leaf', state: 'proximity', close: close, hover: bookLeafHover }, '*'); } catch (e) {}
    }

    
    if (cmd === 'preset' && data.preset) {
      const P = data.preset;
      if (P.species) { currentSpecies = P.species; }
      if (typeof P.day === 'number') { day = P.day; }
      if (typeof P.time === 'number') { timeOfDay = P.time; }
      if (P.weather) { dayWeatherType = P.weather; currentWeather = P.weather; }
      if (P.intensity) { intensityLevel = P.intensity; }
      cinematicMode = false;
      calculateTargetLeaves();
      rebuildTree();
      if (typeof createBookLeaf === 'function') { /* optional leaf off */ }
      updateAtmosphere(); updateLabels();
      if (camera && P.cam) {
        camera.position.set(P.cam.x, P.cam.y, P.cam.z);
        if (controls && P.target) controls.target.set(P.target.x, P.target.y, P.target.z);
        if (controls) controls.update();
      } else if (camera) {
        camera.position.set(9.5, 5.2, 12.5);
        if (controls) { controls.target.set(0, 2.4, 0); controls.update(); }
      }
    }

    if (cmd === 'hideUI') {
      const ui = document.getElementById('ui');
      if (ui) { ui.style.display = 'none'; ui.style.visibility = 'hidden'; }
    }
    if (cmd === 'showUI') {
      const ui = document.getElementById('ui');
      if (ui) { ui.style.display = ''; ui.style.visibility = 'visible'; }
    }
  } catch (err) { console.warn('tree-cmd', err); }
});

</script>
