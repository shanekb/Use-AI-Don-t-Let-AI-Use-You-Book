<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Use AI, Don't Let AI Use You — under the tree</title>
<meta name="theme-color" content="#03050a" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03050a;color:#e8eef5;font-family:Inter,system-ui,sans-serif}
#treeFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#03050a}
#veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 10%,rgba(3,5,10,.2) 50%,rgba(3,5,10,.55) 100%);opacity:0;transition:opacity 1.2s ease}
#veil.on{opacity:1}
#introSplash{position:fixed;inset:0;z-index:50;background:#03050a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;transition:opacity 1.4s ease}
#introSplash.hide{opacity:0;pointer-events:none}
#introSplash p{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.05rem,3.4vw,1.35rem);color:#94a3b8}
#introSplash small{font-size:.55rem;letter-spacing:.36em;text-transform:uppercase;color:#64748b}
#skipIntro{position:fixed;z-index:40;top:max(.9rem,env(safe-area-inset-top));right:1rem;background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.28);color:#94a3b8;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;padding:.48rem .85rem;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s}
#skipIntro.show{opacity:1;pointer-events:auto}
#hud{position:fixed;z-index:15;left:50%;bottom:10%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:.6rem;width:92%;max-width:420px}
#hud.show{display:flex}
#hud p{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:#e0f2fe;text-align:center;text-shadow:0 2px 12px #000}
#hud .row{display:flex;gap:.45rem;width:100%;flex-wrap:wrap;justify-content:center}
.choice{flex:1;min-width:130px;background:rgba(15,23,42,.78);border:1px solid rgba(56,189,248,.45);color:#e0f2fe;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:.65rem .9rem;border-radius:999px;cursor:pointer;text-align:center}
.choice.secondary{border-color:rgba(148,163,184,.3);color:#94a3b8}
#openNear{display:none}
#openNear.show{display:block}

/* Page-turn book reader */
#reader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,10,18,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .7s ease;padding:1rem}
#reader.open{opacity:1;pointer-events:auto}
#reader.full{background:rgba(8,12,20,.96)}
#bookStage{width:min(640px,94vw);height:min(70vh,520px);position:relative;transform-style:preserve-3d;
  filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
#bookStage.full{width:min(720px,96vw);height:min(82vh,640px)}
.pageFace{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#f9f7f1;color:#2c3036;
  border:1px solid #e5e1d4;display:flex;flex-direction:column;padding:1.2rem 1.25rem 1rem}
.pageFace .label{font-size:.55rem;letter-spacing:.32em;text-transform:uppercase;color:#8b929a}
.pageFace h2{font-family:Georgia,serif;font-weight:600;font-size:clamp(1.05rem,3vw,1.25rem);margin:.4rem 0 .9rem;line-height:1.3}
.pageFace .body{font-family:Georgia,serif;font-size:clamp(.95rem,2.5vw,1.05rem);line-height:1.75;flex:1;overflow:auto}
.pageFace .body p+p{margin-top:.8em}
.pageFace .principles{margin-top:.7em;padding-left:.3em}
.pageFace .principles p+p{margin-top:.35em}
.pageFace .folio{margin-top:auto;padding-top:.6rem;font-family:Georgia,serif;font-size:.7rem;color:#a8a394;letter-spacing:.15em}
#leafTurn{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:5;pointer-events:none}
#leafTurn .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;overflow:hidden;background:#f9f7f1;border:1px solid #e5e1d4;padding:1.2rem 1.25rem}
#leafTurn .face-back{transform:rotateY(180deg);background:#f3f0e8}
#leafTurn.turning{animation:leafTurn 1.15s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes leafTurn{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
#readerChrome{width:min(640px,94vw);display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem}
#readerChrome .title{font-family:Georgia,serif;font-style:italic;font-size:.9rem;color:#e2e8f0}
#readerChrome .sub{font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:#94a3b8}
.rbtn{background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.3);color:#e2e8f0;font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;padding:.42rem .65rem;border-radius:999px;cursor:pointer}
#readerNav{width:min(640px,94vw);display:flex;gap:.45rem;justify-content:center;margin-top:.7rem;flex-wrap:wrap}
</style>
</head>
<body>
<div id="introSplash"><p>One tree grows a book.</p><small>A living page in a living world</small></div>
<iframe id="treeFrame" src="tree/index.html" title="Tree world" allow="autoplay"></iframe>
<div id="veil"></div>
<button type="button" id="skipIntro">Skip</button>

<div id="hud">
  <p id="hudText">The book grew with the tree</p>
  <div class="row">
    <button type="button" class="choice" id="pickBook">Touch the book</button>
    <button type="button" class="choice secondary" id="toTree">Stay with the tree</button>
  </div>
  <button type="button" class="choice" id="openNear">Open book</button>
</div>

<div id="reader">
  <div id="readerChrome">
    <div><div class="title">Use AI, Don't Let AI Use You</div><div class="sub">Under the tree · Shane Kittelson-Burke</div></div>
    <div style="display:flex;gap:.35rem">
      <button type="button" class="rbtn" id="expandBtn">Larger view</button>
      <button type="button" class="rbtn" id="closeReader">Tree</button>
    </div>
  </div>
  <div id="bookStage">
    <div class="pageFace" id="pageUnder"></div>
    <div id="leafTurn">
      <div class="face face-front" id="pageFront"></div>
      <div class="face face-back" id="pageBack"></div>
    </div>
  </div>
  <div id="readerNav">
    <button type="button" class="rbtn" id="prevCh">Previous</button>
    <button type="button" class="rbtn" id="tocBtn">Contents</button>
    <button type="button" class="rbtn" id="nextCh">Next page</button>
  </div>
</div>

<script>
const chapters=[
{num:1,roman:'I',title:'Introduction - Defining Good and Evil',body:'<p>Good and evil are the two edges of every tool, and AI is no exception. AI\'s potential depends not on the tool itself but on who controls it and how it is used.</p><p>Good reflects empathy, justice, and responsibility, actions meant to uplift humanity. Evil, on the other hand, emerges through selfishness, indifference, and misuse, often disguised in convenience. AI can either enhance humanity\'s lives or amplify our worst impulses, depending on how it is wielded.</p><p>This book explores how we can use AI for good, avoid its dangers, and ultimately shape a future worth fighting for.</p>'},
{num:2,roman:'II',title:'What AI Can Do for Good',body:'<p>AI has the potential to solve complex problems, automate mundane tasks, and unlock new levels of creativity. It is already improving healthcare, addressing climate challenges, and bridging gaps across industries.</p><p>But the same technology that saves lives can also disrupt them if not guided by the right intent.</p>'},
{num:3,roman:'III',title:'How AI Could Go Wrong',body:'<p>Unchecked AI can easily become a tool of manipulation, surveillance, or bias. Algorithms can spread misinformation, invade privacy, and consolidate power in dangerous ways.</p><p>Once released, the consequences are often irreversible, turning tools of progress into instruments of control.</p>'},
{num:4,roman:'IV',title:'Key Morals for Responsible AI Use',body:'<p>We must instill core principles in AI development:</p><div class="principles"><p>- Transparency: AI systems must be understandable.</p><p>- Accountability: Developers and users must own outcomes.</p><p>- Empathy: AI should always serve humanity\'s well-being.</p><p>- Equity: The benefits of AI must be shared fairly.</p></div>'},
{num:5,roman:'V',title:'Navigating the Unknown Future with AI',body:'<p>The future of AI is uncertain, evolving faster than regulations can keep up. We must stay vigilant and make wise decisions today to ensure AI works for us tomorrow.</p><p>In this unpredictable landscape, AI can either become our greatest ally or a threat we cannot control.</p>'},
{num:6,roman:'VI',title:'The Call to Action',body:'<p>Every individual has a role in shaping AI\'s future. Push for accountability, demand transparency, and stay informed.</p><p>The window to act is closing. We must decide: Will AI be our tool for good, or will it control us for evil?</p>'}
];

const tree=document.getElementById('treeFrame');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function cmd(p){try{tree.contentWindow&&tree.contentWindow.postMessage({type:'tree-cmd',...p},'*');}catch(e){}}
function sleep(ms){return reduced?Promise.resolve():new Promise(r=>setTimeout(r,ms));}

let chapterIndex=0,busy=false,seen=false,hovering=false,readerFull=false;
try{seen=localStorage.getItem('uai-c1')==='1';}catch(e){}

/* soft page-flip sound */
let actx;
function flipSound(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    const b=actx.createBuffer(1,actx.sampleRate*0.12,actx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*8)*0.4;}
    const s=actx.createBufferSource(); s.buffer=b;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=0.8;
    const g=actx.createGain(); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t);
  }catch(e){}
}

function pageHTML(ch){
  return '<p class="label">Chapter '+ch.num+' · '+ch.roman+'</p><h2>'+ch.title+'</h2><div class="body">'+ch.body+'</div><div class="folio">'+ch.roman+'</div>';
}
function paintPages(){
  const cur=chapters[chapterIndex];
  const next=chapters[(chapterIndex+1)%6];
  document.getElementById('pageFront').innerHTML=pageHTML(cur);
  document.getElementById('pageUnder').innerHTML=pageHTML(next);
  document.getElementById('pageBack').innerHTML='<p class="label">Chapter</p><h2 style="font-family:Georgia;font-style:italic;color:#a8a394;margin-top:2rem;text-align:center">'+next.roman+'</h2>';
}
function openReader(){
  document.getElementById('reader').classList.add('open');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('veil').classList.add('on');
  cmd({cmd:'setWeather',weather:'clear'});cmd({cmd:'setIntensity',level:'super'});cmd({cmd:'setTime',time:22.2});cmd({cmd:'hideUI'});
  paintPages();
}
function closeReader(){
  document.getElementById('reader').classList.remove('open','full');
  document.getElementById('bookStage').classList.remove('full');
  readerFull=false;
  document.getElementById('expandBtn').textContent='Larger view';
  endState();
}
function flipNext(){
  if(busy)return; busy=true; flipSound();
  const leaf=document.getElementById('leafTurn');
  leaf.classList.add('turning');
  setTimeout(()=>{
    chapterIndex=(chapterIndex+1)%6;
    leaf.classList.remove('turning');
    paintPages();
    busy=false;
  },1150);
}
function flipPrev(){
  if(busy)return; busy=true; flipSound();
  chapterIndex=(chapterIndex-1+6)%6;
  paintPages();
  setTimeout(()=>busy=false,200);
}

document.getElementById('nextCh').onclick=flipNext;
document.getElementById('prevCh').onclick=flipPrev;
document.getElementById('tocBtn').onclick=()=>{const n=parseInt(prompt('Chapter 1-6'),10);if(n>=1&&n<=6){chapterIndex=n-1;paintPages();}};
document.getElementById('closeReader').onclick=closeReader;
document.getElementById('expandBtn').onclick=()=>{
  readerFull=!readerFull;
  document.getElementById('reader').classList.toggle('full',readerFull);
  document.getElementById('bookStage').classList.toggle('full',readerFull);
  document.getElementById('expandBtn').textContent=readerFull?'Show tree':'Larger view';
};

function endState(){
  cmd({cmd:'cinematicEnd'});
  document.getElementById('veil').classList.add('on');
  document.getElementById('hud').classList.add('show');
  document.getElementById('hudText').textContent='The book grew with the tree — touch it';
  document.getElementById('openNear').classList.remove('show');
  document.getElementById('skipIntro').classList.remove('show');
}

document.getElementById('pickBook').onclick=()=>{
  cmd({cmd:'detachBook'});
  document.getElementById('hudText').textContent='The book falls… move closer to open';
  // poll proximity
  const iv=setInterval(()=>cmd({cmd:'bookProximity'}),400);
  setTimeout(()=>clearInterval(iv),20000);
};
document.getElementById('openNear').onclick=()=>openReader();
document.getElementById('toTree').onclick=()=>{
  document.getElementById('hud').classList.remove('show');
  document.getElementById('veil').classList.remove('on');
  cmd({cmd:'showUI'});
  cmd({cmd:'setCamera',pos:{x:9.5,y:5.2,z:12.5},target:{x:0,y:2.6,z:0}});
};

window.addEventListener('message',(ev)=>{
  const d=ev.data; if(!d||d.type!=='book-leaf')return;
  if(d.state==='hover'){
    document.getElementById('hudText').textContent='It hovers under the tree — get closer';
  }
  if(d.state==='proximity'&&d.close&&d.hover){
    document.getElementById('openNear').classList.add('show');
    document.getElementById('hudText').textContent='Open the book';
  }
  if(d.state==='ready'){ /* cinematic ended inside tree */ }
});

async function runCinematic(){
  const skip=document.getElementById('skipIntro');
  skip.classList.add('show');
  let aborted=false;
  skip.onclick=()=>{aborted=true;try{localStorage.setItem('uai-c1','1');}catch(e){}endState();};
  cmd({cmd:'hideUI'});
  cmd({cmd:'cinematicStart'}); // 5:30 mist, seed, book leaf on tree
  await sleep(900); if(aborted)return;
  // ticks ~20 days each
  for(let i=0;i<8;i++){
    if(aborted)return;
    cmd({cmd:'cinematicTick'});
    await sleep(900);
  }
  if(aborted)return;
  cmd({cmd:'cinematicEnd'});
  try{localStorage.setItem('uai-c1','1');}catch(e){}
  await sleep(600);
  endState();
}

let booted=false;
async function boot(){
  if(booted)return;booted=true;
  await sleep(500);
  document.getElementById('introSplash').classList.add('hide');
  await sleep(800);
  if(seen||reduced) endState();
  else runCinematic();
}
tree.addEventListener('load',()=>setTimeout(boot,600));
setTimeout(boot,4500);
</script>
</body>
</html>
